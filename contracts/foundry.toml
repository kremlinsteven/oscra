[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
ast = true
remappings = ["forge-std/=lib/forge-std/src/"]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 48
fail_on_revert = false

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"

[lint]
lint_on_build = false
